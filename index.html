<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Tense Master - AI Generated Questions</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    .main-container { width: 100%; max-width: 800px; text-align: center; }
    .hero h1 {
      font-size: 3rem; font-weight: 700; margin-bottom: 0.5rem;
      background: linear-gradient(to right, #f7971e, #ffd200);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .tagline { color: #b3b3cc; font-size: 1.1rem; margin-bottom: 40px; font-weight: 500; }
    .menu-container {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-bottom: 20px;
    }
    .menu-card {
      background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 24px;
      padding: 30px 15px; cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .menu-card:hover {
      transform: translateY(-8px); background: rgba(255,255,255,0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.3);
    }
    .card-icon { font-size: 2.8rem; margin-bottom: 10px; }
    .menu-card h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .menu-card p { font-size: 0.85rem; color: #ccccdd; }
    .game-panel {
      background: rgba(255,255,255,0.07); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 30px;
      padding: 35px 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp { from { opacity:0; transform: translateY(30px); } to { opacity:1; transform: translateY(0); } }
    .question-display {
      background: rgba(0,0,0,0.3); border-radius: 20px; padding: 25px 20px;
      margin-bottom: 25px; font-size: 1.4rem; font-weight: 600; min-height: 90px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .answer-section { display: flex; gap: 12px; margin-bottom: 20px; }
    #user-input {
      flex: 1; padding: 14px 22px; font-size: 1rem;
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px; outline: none; color: white; font-weight: 500; transition: 0.3s;
    }
    #user-input::placeholder { color: #aaa; }
    #user-input:focus {
      border-color: #f7971e; box-shadow: 0 0 20px rgba(247,151,30,0.3);
    }
    .submit-btn {
      padding: 14px 30px; background: linear-gradient(45deg, #f7971e, #ffd200);
      border: none; border-radius: 50px; font-weight: 700; color: #1a1a2e;
      cursor: pointer; transition: 0.3s; font-size: 1rem; letter-spacing: 0.5px;
    }
    .submit-btn:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(247,151,30,0.4); }
    .feedback-message { font-size: 1.2rem; font-weight: 700; margin: 10px 0; min-height: 35px; }
    .alt-message { color: #ffd966; margin-bottom: 20px; font-size: 0.95rem; }
    .score-display {
      background: rgba(255,255,255,0.15); display: inline-block;
      padding: 10px 30px; border-radius: 40px; font-weight: 600; margin-bottom: 20px; font-size: 1.1rem;
    }
    .back-btn {
      background: rgba(255,255,255,0.2); border: none; padding: 12px 28px;
      border-radius: 50px; font-weight: 600; color: white; cursor: pointer; transition: 0.3s; font-size: 0.95rem;
    }
    .back-btn:hover { background: rgba(255,255,255,0.35); }
    @media (max-width: 550px) {
      .hero h1 { font-size: 2rem; }
      .menu-container { grid-template-columns: 1fr 1fr; gap: 15px; }
      .answer-section { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="main-container">
    <header class="hero">
      <h1>✨ English Tense Master ✨</h1>
      <p class="tagline">AI हर बार नया सवाल बनाएगा – कोई प्री-लोडेड सवाल नहीं</p>
    </header>

    <!-- मेनू -->
    <div id="menu" class="menu-container">
      <div class="menu-card" onclick="startSection('present')">
        <div class="card-icon">📘</div>
        <h2>Present Tense</h2>
        <p>AI बनाएगा सवाल</p>
      </div>
      <div class="menu-card" onclick="startSection('past')">
        <div class="card-icon">📙</div>
        <h2>Past Tense</h2>
        <p>AI बनाएगा सवाल</p>
      </div>
      <div class="menu-card" onclick="startSection('future')">
        <div class="card-icon">📗</div>
        <h2>Future Tense</h2>
        <p>AI बनाएगा सवाल</p>
      </div>
      <div class="menu-card" onclick="startSection('mix')">
        <div class="card-icon">🎯</div>
        <h2>Mixed Tenses</h2>
        <p>AI बनाएगा सवाल</p>
      </div>
      <div class="menu-card" onclick="startSection('active-passive')">
        <div class="card-icon">🔄</div>
        <h2>Active ↔ Passive</h2>
        <p>AI बनाएगा सवाल</p>
      </div>
    </div>

    <!-- गेम एरिया (शुरू में छिपा) -->
    <div id="game-area" class="game-area" style="display: none;">
      <div class="game-panel">
        <div class="question-display">
          <span id="question-text"></span>
        </div>
        <div class="answer-section">
          <input type="text" id="user-input" placeholder="अपना उत्तर लिखें..." autocomplete="off">
          <button id="submit-btn" class="submit-btn">✓ Check</button>
        </div>
        <div id="feedback" class="feedback-message"></div>
        <div id="alternatives" class="alt-message"></div>
        <div class="score-display">
          <span>⭐ Score: <strong id="score">0</strong></span>
        </div>
        <button id="back-btn" class="back-btn" onclick="goBack()">← Back to Menu</button>
      </div>
    </div>
  </div>

  <script>
    // ========== ऐप लॉजिक – पूरी तरह AI आधारित ==========
    let currentSection = '';
    let usedQuestions = [];        // पूछे जा चुके हिंदी/एक्टिव वाक्य (दोहराने से बचने के लिए)
    let currentQuestion = null;   // वर्तमान में दिख रहा प्रश्न
    let score = 0;
    let apiKey = '';

    // 🔑 API Key लेने का फंक्शन
    function askForApiKey() {
      return new Promise((resolve) => {
        const key = prompt("🔑 अपनी Groq API Key डालें (यह सिर्फ इस सेशन के लिए याद रहेगी):");
        if (key && key.trim().length > 0) {
          apiKey = key.trim();
          resolve(true);
        } else {
          alert("API Key ज़रूरी है! बिना key के AI काम नहीं करेगा।");
          resolve(false);
        }
      });
    }

    // 📚 सेक्शन शुरू करें – सीधे AI से पहला सवाल लाएँ
    async function startSection(section) {
      if (!apiKey) {
        const gotKey = await askForApiKey();
        if (!gotKey) return;
      }
      currentSection = section;
      score = 0;
      usedQuestions = [];
      document.getElementById('score').innerText = score;
      document.getElementById('menu').style.display = 'none';
      document.getElementById('game-area').style.display = 'block';

      // पहला सवाल AI से लाएँ
      document.getElementById('feedback').innerText = 'AI आपके लिए सवाल बना रहा है...';
      document.getElementById('submit-btn').disabled = true;
      await generateAndDisplayQuestion();
      document.getElementById('submit-btn').disabled = false;
    }

    // 🔙 मेनू पर वापस जाएँ
    function goBack() {
      document.getElementById('game-area').style.display = 'none';
      document.getElementById('menu').style.display = '';
      currentQuestion = null;
    }

    // 🤖 Groq API को कॉल करने का सामान्य फंक्शन
    async function callGroqAPI(messages) {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          messages: messages,
          temperature: 0.3,
          max_tokens: 300,
          response_format: { type: "json_object" }  // JSON mode ऑन
        })
      });

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.error?.message || 'API error');
      }

      const data = await response.json();
      let content = data.choices[0].message.content.trim();

      // JSON को साफ करें
      if (content.startsWith('```json')) {
        content = content.slice(7, -3).trim();
      } else if (content.startsWith('```')) {
        content = content.slice(3, -3).trim();
      }

      // सुरक्षित पार्सिंग
      try {
        return JSON.parse(content);
      } catch (e) {
        const firstBrace = content.indexOf('{');
        const lastBrace = content.lastIndexOf('}');
        if (firstBrace !== -1 && lastBrace !== -1 && firstBrace < lastBrace) {
          const jsonPart = content.substring(firstBrace, lastBrace + 1);
          return JSON.parse(jsonPart);
        }
        throw new Error('Invalid JSON from AI: ' + content);
      }
    }

    // 🧠 AI से नया सवाल बनवाएँ और स्क्रीन पर दिखाएँ
    async function generateAndDisplayQuestion() {
      const tense = currentSection === 'mix' ? 'all' : currentSection;
      let systemPrompt, userPrompt;

      if (currentSection === 'active-passive') {
        const usedList = usedQuestions.map(s => `"${s}"`).join(', ');
        systemPrompt = `Generate a new active voice English sentence (simple to moderate difficulty) for passive voice practice. Do NOT use these already used sentences: [${usedList}]. Reply with JSON: { "active": "..." }`;
        userPrompt = "Generate.";
      } else {
        const usedList = usedQuestions.map(s => `"${s}"`).join(', ');
        systemPrompt = `Generate a new Hindi sentence for ${tense} tense English translation practice. The sentence should be natural and varied. Do NOT use these already used sentences: [${usedList}]. Reply with JSON: { "hindi": "..." }`;
        userPrompt = "Generate.";
      }

      try {
        const result = await callGroqAPI([
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]);

        if (result.hindi) {
          currentQuestion = { hindi: result.hindi };
          usedQuestions.push(result.hindi);
        } else if (result.active) {
          currentQuestion = { active: result.active };
          usedQuestions.push(result.active);
        } else {
          throw new Error('AI did not return a question.');
        }

        displayQuestion();
      } catch (err) {
        document.getElementById('feedback').innerText = '❌ AI सवाल नहीं बना पाया। कृपया दोबारा कोशिश करें या API key जाँचें।';
        document.getElementById('submit-btn').disabled = false;
        // गेम एरिया में वापसी का विकल्प
      }
    }

    // 🖥️ सवाल को स्क्रीन पर दिखाएँ
    function displayQuestion() {
      const qText = document.getElementById('question-text');
      if (currentSection === 'active-passive') {
        qText.innerHTML = `Change to Passive Voice:<br><b>${currentQuestion.active}</b>`;
      } else {
        qText.innerHTML = `Translate to English:<br><b>${currentQuestion.hindi}</b>`;
      }
      document.getElementById('user-input').value = '';
      document.getElementById('feedback').innerText = '';
      document.getElementById('alternatives').innerText = '';
    }

    // ✅ "Check" बटन दबाने पर
    document.getElementById('submit-btn').addEventListener('click', async () => {
      if (!apiKey) {
        const gotKey = await askForApiKey();
        if (!gotKey) return;
      }
      const userAnswer = document.getElementById('user-input').value.trim();
      if (!userAnswer) return;

      if (!currentQuestion) {
        document.getElementById('feedback').innerText = 'कोई सवाल मौजूद नहीं। कृपया सेक्शन दोबारा शुरू करें।';
        return;
      }

      let systemPrompt, userPrompt;
      if (currentSection === 'active-passive') {
        systemPrompt = `Check if the passive voice is correct. Active: "${currentQuestion.active}". Reply JSON: { "status":"CORRECT/INCORRECT", "message":"...", "correct_passive":"...", "alternatives":[...] }`;
        userPrompt = `User Passive: "${userAnswer}"`;
      } else {
        const tense = currentSection === 'mix' ? 'all' : currentSection;
        systemPrompt = `Check if the English translation is correct. Hindi: "${currentQuestion.hindi}". Tense: ${tense}. Reply JSON: { "status":"CORRECT/INCORRECT", "message":"...", "correct_translation":"...", "alternatives":[...] }`;
        userPrompt = `User English: "${userAnswer}"`;
      }

      document.getElementById('submit-btn').disabled = true;
      try {
        const result = await callGroqAPI([
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]);

        if (result.status === 'CORRECT') {
          score++;
          document.getElementById('score').innerText = score;
          document.getElementById('feedback').innerHTML = '✅ Correct! ' + (result.message || '');
          if (result.alternatives && result.alternatives.length) {
            document.getElementById('alternatives').innerText = 'Other ways: ' + result.alternatives.join(', ');
          } else {
            document.getElementById('alternatives').innerText = '';
          }
          // अगला सवाल AI से लाएँ
          setTimeout(async () => {
            document.getElementById('feedback').innerText = 'AI अगला सवाल बना रहा है...';
            await generateAndDisplayQuestion();
            document.getElementById('submit-btn').disabled = false;
          }, 1200);
        } else {
          document.getElementById('feedback').innerHTML = '❌ Incorrect. ' + (result.message || '');
          const correct = result.correct_translation || result.correct_passive || '';
          if (correct) document.getElementById('alternatives').innerText = 'Correct: ' + correct;
          document.getElementById('submit-btn').disabled = false;
        }
      } catch (err) {
        document.getElementById('feedback').innerText = 'Error: ' + err.message;
        document.getElementById('submit-btn').disabled = false;
      }
    });

    // ⌨️ एंटर की से भी सबमिट
    document.getElementById('user-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('submit-btn').click();
    });
  </script>
</body>
</html>
